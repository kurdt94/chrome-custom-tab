<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Custom-Tab – Settings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #121212;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
	  width: 640px; 
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #fff;
    }
    p {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #ccc;
    }
    input[type="url"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #2a2a2a;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="url"]:focus {
      border-color: #4a9eff;
    }
    .actions {
      margin-top: 24px;
      display: flex;
      gap: 12px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    #save {
      background: #4a9eff;
      color: #fff;
    }
    #save:hover {
      background: #3a8eef;
    }
    #reset {
      background: #333;
      color: #ccc;
    }
    #reset:hover {
      background: #444;
    }
    #status {
      margin-top: 16px;
      font-size: 13px;
      min-height: 20px;
      text-align: center;
    }
    .success { color: #4caf50; }
    .error { color: #f44336; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Custom Tab</h1>
    <p>Set the URL that should open every time you open a new tab.</p>

    <label for="url">Custom New Tab URL</label>
    <input type="url" id="url" placeholder="https://example.com" autocomplete="off" spellcheck="false">

    <div class="actions">
      <button id="save">Save</button>
      <button id="reset">Reset to Google</button>
    </div>

    <div id="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
